<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Caducée Pharmaceutique Algérien : Croissant Vert & Serpent d'Épidaure -->
  <!-- Croissant Vert -->
  <path d="M12.5 3.5C7.25 3.5 3 7.75 3 13s4.25 9.5 9.5 9.5c2.4 0 4.6-.9 6.3-2.4-4.8-.3-8.8-4.2-8.8-9.1s4-8.8 8.8-9.1c-1.7-1.5-3.9-2.4-6.3-2.4z" 
        fill="currentColor" opacity="0.95"/>
  <!-- Serpent d'Épidaure enroulé autour du croissant -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Queue du serpent en bas -->
    <path d="M15 21.5c-1.8.8-3.5 0-3.8-1.5-.3-1.8 1.8-2.5 1.5-4.5"/>
    <!-- Corps du serpent traversant le croissant au centre -->
    <path d="M11 15c-1.8-1.5-2.2-3.8-.5-5.2 1.8-1.5 3.5-1 3-3"/>
    <!-- Haut et tête du serpent -->
    <path d="M13.5 6.8c-.2-1.5 1-2.8 2.5-3 1.2-.2 2.2.6 2 1.8-.2 1-1.2 1.5-2 1.5"/>
  </g>
  <!-- Tête du serpent -->
  <circle cx="17.2" cy="5.2" r="1.1" fill="currentColor"/>
  <!-- Oeil du serpent -->
  <circle cx="17.2" cy="5.2" r="0.35" fill="#ffffff"/>
  <!-- Goutte / Langue -->
  <circle cx="18.5" cy="7" r="0.6" fill="currentColor"/>
</svg>