name: CI — Intégrité & Conformité BPF

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Vérification Qualité & Formatage du Code
  # ============================================================================
  quality:
    name: "Qualité & Formatage"
    runs-on: ubuntu-latest
    steps:
      - name: "Récupération du code source"
        uses: actions/checkout@v4

      - name: "Configuration de l'environnement Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: "Contrôle du formatage Go (gofmt)"
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "Erreur : Les fichiers suivants ne respectent pas le format gofmt standard :"
            echo "$DIFF"
            exit 1
          fi

      - name: "Analyse statique standard (go vet)"
        run: go vet ./...

  # ============================================================================
  # 2. Tests Unitaires & Intégration avec PostgreSQL 16
  # ============================================================================
  test:
    name: "Tests Unitaires & Sécurité BPF"
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homolog_test
          POSTGRES_USER: homolog
          POSTGRES_PASSWORD: homolog_secret_2026
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Récupération du code source"
        uses: actions/checkout@v4

      - name: "Configuration de l'environnement Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: "Exécution des tests avec détection de concurrence (-race)"
        env:
          DATABASE_URL: postgres://homolog:homolog_secret_2026@localhost:5434/homolog_test?sslmode=disable
          DEPLOYMENT_MODE: on-premise
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: "Archivage du rapport de couverture de code"
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.txt
          retention-days: 7

  # ============================================================================
  # 3. Compilation Multi-Plateforme (Binaires Autonomes)
  # ============================================================================
  build:
    name: "Compilation Multi-Plateforme"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "Récupération du code source"
        uses: actions/checkout@v4

      - name: "Configuration de l'environnement Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: "Création du dossier de distribution"
        run: mkdir -p dist

      - name: "Compilation Binaire Linux AMD64 (Statique sans CGO)"
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X 'main.Version=0.7.0' -X 'main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dist/homolog-linux-amd64 ./cmd/server

      - name: "Compilation Binaire Windows AMD64 (.exe)"
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X 'main.Version=0.7.0' -X 'main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dist/homolog-windows-amd64.exe ./cmd/server

      - name: "Compilation Binaire Linux ARM64 (Serveurs Cloud / Raspberry Pi)"
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X 'main.Version=0.7.0' -X 'main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dist/homolog-linux-arm64 ./cmd/server

      - name: "Génération des empreintes cryptographiques SHA-256"
        working-directory: dist
        run: |
          sha256sum homolog-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: "Publication des artéfacts de compilation"
        uses: actions/upload-artifact@v4
        with:
          name: homolog-standalone-binaries
          path: dist/*
          retention-days: 14

  # ============================================================================
  # 4. Validation du Conteneur Docker (Multi-Stage Build)
  # ============================================================================
  docker:
    name: "Validation Conteneur Docker"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: "Récupération du code source"
        uses: actions/checkout@v4

      - name: "Configuration de Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Construction et vérification de l'image Docker de production"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: homolog:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
