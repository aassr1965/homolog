name: PR Agent (Qodo Open-Source)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name != 'issue_comment' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Run PR-Agent with Gemini
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Modèle Gemini et clé Google AI Studio
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'
          config.custom_model_max_tokens: "32000"
          config.max_model_tokens: "32000"
          config.patch_extra_lines: "1"
          config.ai_timeout: "360"
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Optimisations pour gros volumes et compatibilité Free Tier (Quota 250k TPM)
          pr_processing.ignore_file_extensions: '["sql", "json", "md", "png", "svg", "lock", "sum"]'
          pr_description.inline_file_summary: "false"
          pr_reviewer.num_code_suggestions: "2"
          pr_reviewer.inline_code_comments: "false"
          
          # Gestion de la résilience réseau et retries sur Rate Limit (429)
          LITELLM_NUM_RETRIES: "8"
          LITELLM_RETRY_AFTER: "true"

          # Automations lors de l'ouverture d'une PR ou sur commande via issue_comment
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
