[config]
max_model_tokens = 200000
custom_model_max_tokens = 200000
patch_extra_lines = 2
ai_timeout = 360

[ignore]
glob = [
  "docs/**",
  "*.md",
  "brochure_print.html",
  "web/presentation.html"
]

[pr_reviewer]
enable_review_labels_security = true
num_code_suggestions = 4

[pr_description]
publish_labels = true
